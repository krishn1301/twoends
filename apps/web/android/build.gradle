// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    /*
      Declared here rather than in variables.gradle because `apply from` runs
      after this block — buildscript classpaths cannot see it.
    */
    ext.kotlinVersion = '2.1.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        /*
          Kotlin, for the widgets only. Glance is Compose, and Compose is
          Kotlin-only — there is no Java path to an app widget built this way.
          The Capacitor Activity stays Java; the two coexist in one module.
        */
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
