distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# `-bin` rather than Capacitor's default `-all`. The difference is Gradle's own
# sources and API docs, which only an IDE offering Gradle autocompletion uses —
# there is no IDE here. Saves roughly 70 MB on a first build.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# Ten seconds is the default and it is not enough to start a 130 MB download on
# a domestic connection. The wrapper does not resume, so a timeout means
# fetching the whole thing again.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
