<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the page reach under the notch and home
      indicator; the safe-area insets in the CSS keep content clear of both.
      Without it an installed PWA renders with black bars on an iPhone.

      `user-scalable=no` is here because pinch-zoom is what made the APK feel
      like a website — and worse, it broke the layout: the rails are sized in
      `vw`, so a zoomed viewport re-lays them out at the wrong width and cards
      end up clipped. Native apps do not do this and neither should this one.

      It is a smaller hammer than it looks. Android's WebView honours it, which
      is the case that mattered. iOS Safari has ignored it since iOS 10, so
      iPhone users — most of the people this app is for — keep their
      accessibility zoom regardless. Text still scales with the system font
      size on both, because nothing here is sized in `px`.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>TwoEnds</title>
    <meta name="description" content="A small shared space for two people. Free, permanently." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" />
    <!-- iOS ignores the manifest icons and uses this one for the home screen. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TwoEnds" />
    <meta name="theme-color" content="#000000" />
    <script type="module" crossorigin src="/twoends/assets/index-ahD4LgpO.js"></script>
    <link rel="stylesheet" crossorigin href="/twoends/assets/index-mtjjEXd6.css">
  </head>
  <body>
    <!--
      K for S.

      Built for one person, then opened up. If you are reading this you have
      opened the source of somebody's app for their girlfriend, which is a
      strange and slightly wonderful thing to be doing with an afternoon.

      Everything here is free and stays free. There is no analytics script, no
      tag manager, and nothing below this line that phones anywhere except the
      one database this couple's own rows live in.
    -->
    <div id="root"></div>
  </body>
</html>
